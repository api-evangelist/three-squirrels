description: 'Three Squirrels (三只松鼠) is a Chinese consumer snack company founded in
  2012 by Zhang Liaoyuan and headquartered in Wuhu, Anhui Province. Positioned as one
  of China''s first internet-native food brands, it sells nuts, seeds, dried fruits,
  baked goods, and other leisure snacks primarily through e-commerce channels (Tmall,
  JD.com, and its own storefronts) alongside a growing offline retail footprint. The
  company is publicly listed on the Shenzhen Stock Exchange ChiNext board (stock code
  300783). It was surfaced as a portfolio company of IDG Capital and added to the API
  Evangelist network as a stub for enrichment; as a consumer packaged-goods retailer
  it does not publish a public developer API, open platform, or API documentation.
  Sector: consumer.'
